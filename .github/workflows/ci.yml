# Phase 01 minimal PR CI — replace/extend in phase 15 (prompts/p15-release-ci.md).
# Jobs run the real commands wired by this scaffold; content jobs only, no release work yet.
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    name: rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: version stamp check
        run: node tooling/generate-version.mjs --check
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (warnings are blockers)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  web:
    name: web (lint / typecheck / vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: version stamp check
        run: node tooling/generate-version.mjs --check
      - name: eslint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: vitest
        run: pnpm test

  android:
    name: android (assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: assembleDebug
        run: ./gradlew assembleDebug
