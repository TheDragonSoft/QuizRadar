[package]
name = "quizradar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QuizRadar v5 core: parsers, planner, calendar, store, sources, auth — pure Rust, UI-agnostic."

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
uniffi = ["dep:uniffi", "uniffi/tokio"]
cli = ["uniffi", "uniffi/cli"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
# Bounded-concurrency source scans (buffer_unordered/buffered) — phase 05.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# PKCE (RFC 7636) S256 challenge + single-use state entropy — phase 05.
# Small, pure-Rust, maintained crates; no client_secret flows exist at all.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
uniffi = { version = "0.28", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite.workspace = true
reqwest.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }
# Recorded-HTTP fixture tests for the source fetchers (phase 05 acceptance).
wiremock = "0.6"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "deny"
panic = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
