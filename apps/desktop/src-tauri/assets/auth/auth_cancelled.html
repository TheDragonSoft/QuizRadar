<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizRadar — Sign-In Cancelled</title>
    <style>
      body {
        background: #0b0f19;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }
      .card {
        background: #131927;
        border: 1px solid #1e293b;
        border-radius: 16px;
        padding: 28px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      .icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: rgba(148, 163, 184, 0.15);
        color: #94a3b8;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 18px;
        margin: 0 0 8px 0;
        color: #ffffff;
        font-weight: 700;
      }
      p {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.5;
        margin: 0 0 20px 0;
      }
      .btn {
        display: inline-block;
        background: #1a73e8;
        color: #ffffff;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 10px;
        transition: background 0.2s;
        cursor: pointer;
        border: none;
      }
      .btn:hover {
        background: #1557b0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">⏹️</div>
      <h2>Sign-In Cancelled</h2>
      <p>No account was connected. You can close this tab and try again from the QuizRadar app.</p>
      <button class="btn" onclick="window.close()">Return to QuizRadar</button>
    </div>
    <script>
      setTimeout(function () {
        try {
          window.close();
        } catch (e) {}
      }, 2000);
    </script>
  </body>
</html>
