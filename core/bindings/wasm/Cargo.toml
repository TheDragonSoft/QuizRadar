[package]
name = "quizradar-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# The browser tier binds the pure modules only — the UniFFI surface (SQLite
# store + reqwest/tokio fetchers) is native-only and must not reach wasm32.
quizradar-core = { path = "../..", default-features = false }
