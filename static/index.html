<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Calendar</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Roboto & Google Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #3c4043;
      background-color: #ffffff;
      overflow: hidden;
      user-select: none;
    }
    .font-google {
      font-family: 'Google Sans', 'Roboto', sans-serif;
    }
    /* Grid dimensions: 1 hour = 52px */
    .time-slot-height {
      height: 52px;
    }
    .grid-border-bottom {
      border-bottom: 1px solid #dadce0;
    }
    .grid-border-right {
      border-right: 1px solid #dadce0;
    }
    /* Event card styling exactly like Google Calendar */
    .gcal-event {
      position: absolute;
      left: 2px;
      right: 3px;
      border-radius: 4px;
      padding: 4px 6px;
      overflow: hidden;
      cursor: pointer;
      line-height: 1.25;
      transition: filter 0.1s ease, box-shadow 0.1s ease;
      z-index: 5;
    }
    .gcal-event:hover {
      filter: brightness(0.96);
      box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
      z-index: 20;
    }
    .create-btn-shadow {
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.30), 0 1px 3px 1px rgba(60,64,67,0.15);
    }
    .create-btn-shadow:hover {
      box-shadow: 0 1px 3px 0 rgba(60,64,67,0.30), 0 4px 8px 3px rgba(60,64,67,0.15);
    }
    /* Week selection pill in mini calendar */
    .mini-week-row {
      border-radius: 14px;
      background-color: #e8f0fe;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col">

  <!-- ================= TOP GOOGLE BAR ================= -->
  <header class="h-16 border-b border-[#dadce0] px-4 flex items-center justify-between shrink-0 bg-white z-30">
    
    <!-- Left: Hamburger, Calendar Logo, Title, Today, Nav, Month/Year -->
    <div class="flex items-center space-x-3 sm:space-x-4">
      <button onclick="toggleSidebar()" class="p-2 rounded-full hover:bg-[#f1f3f4] text-[#5f6368] transition" title="Main menu">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>

      <!-- Calendar Logo & Title -->
      <div class="flex items-center space-x-2.5 cursor-pointer select-none" onclick="location.reload()">
        <!-- White calendar square with blue/red header & date 30 -->
        <div class="w-10 h-10 rounded-lg border border-[#dadce0] bg-white flex flex-col items-center justify-between shadow-xs overflow-hidden">
          <div class="w-full bg-[#1a73e8] text-white text-[9px] font-bold text-center tracking-tight py-0.5 uppercase">
            OCT
          </div>
          <div class="text-base font-google font-bold text-[#3c4043] -mt-1 pb-0.5">
            18
          </div>
        </div>
        <span class="text-[22px] font-google text-[#3c4043] tracking-normal font-normal">Calendar</span>
      </div>

      <!-- "Today" Button -->
      <button onclick="goToCurrentWeek()" class="ml-3 px-4 py-2 border border-[#dadce0] rounded-md text-sm font-google font-medium text-[#3c4043] hover:bg-[#f8f9fa] transition">
        Today
      </button>

      <!-- Prev / Next Chevrons -->
      <div class="flex items-center space-x-0.5">
        <button onclick="changeWeek(-1)" class="p-2 rounded-full hover:bg-[#f1f3f4] text-[#5f6368] transition" title="Previous week">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <button onclick="changeWeek(1)" class="p-2 rounded-full hover:bg-[#f1f3f4] text-[#5f6368] transition" title="Next week">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Month Year Display -->
      <h2 id="calendar-title" class="text-[22px] font-google text-[#3c4043] font-normal pl-2">
        October 2026
      </h2>
    </div>

    <!-- Right: Search, Settings, View Dropdown (Week), Avatar -->
    <div class="flex items-center space-x-2 sm:space-x-3">
      <!-- Search -->
      <button class="p-2.5 rounded-full hover:bg-[#f1f3f4] text-[#5f6368] transition" title="Search">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </button>

      <!-- Settings -->
      <button class="p-2.5 rounded-full hover:bg-[#f1f3f4] text-[#5f6368] transition" title="Settings menu">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>

      <!-- View Selector Dropdown: "Week" -->
      <div class="relative">
        <button id="view-dropdown-btn" onclick="toggleDropdown()" class="flex items-center space-x-2 px-3.5 py-2 border border-[#dadce0] rounded-md text-sm font-google font-medium text-[#3c4043] hover:bg-[#f8f9fa] transition">
          <span id="active-view-label">Week</span>
          <i data-lucide="chevron-down" class="w-4 h-4 text-[#5f6368]"></i>
        </button>
        <div id="view-menu" class="absolute right-0 mt-1 w-36 bg-white border border-[#dadce0] rounded-lg shadow-lg py-1.5 hidden z-50">
          <button onclick="setView('Day')" class="w-full text-left px-4 py-2 text-sm text-[#3c4043] hover:bg-[#f1f3f4]">Day</button>
          <button onclick="setView('Week')" class="w-full text-left px-4 py-2 text-sm text-[#3c4043] hover:bg-[#f1f3f4] font-semibold flex items-center justify-between">
            <span>Week</span>
            <i data-lucide="check" class="w-4 h-4 text-[#1a73e8]"></i>
          </button>
          <button onclick="setView('Month')" class="w-full text-left px-4 py-2 text-sm text-[#3c4043] hover:bg-[#f1f3f4]">Month</button>
        </div>
      </div>

      <!-- Avatar Circle (with Letter "A" like screenshot) -->
      <div class="w-8 h-8 rounded-full bg-[#673ab7] text-white font-google font-medium flex items-center justify-center text-sm shadow-xs cursor-pointer ml-1 select-none" title="omar.ahmed126@msa.edu.eg">
        A
      </div>
    </div>
  </header>

  <!-- ================= MAIN BODY CONTAINER ================= -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- LEFT SIDEBAR -->
    <aside id="sidebar" class="w-64 shrink-0 border-r border-[#dadce0] p-3 flex flex-col space-y-6 overflow-y-auto bg-white">
      
      <!-- "+ Create" Button -->
      <div class="pt-1">
        <button class="flex items-center space-x-3 pl-3 pr-6 py-2.5 rounded-full create-btn-shadow bg-white text-[#3c4043] font-google font-medium text-sm transition">
          <svg class="w-8 h-8" viewBox="0 0 36 36">
            <path fill="#4285F4" d="M16 16v14h4V20z"/>
            <path fill="#34A853" d="M30 16H20l-4 4h14z"/>
            <path fill="#FBBC05" d="M6 16h10l4-4H6z"/>
            <path fill="#EA4335" d="M20 16V6h-4v10z"/>
            <path fill="none" d="M0 0h36v36H0z"/>
          </svg>
          <span class="text-sm font-medium">Create</span>
        </button>
      </div>

      <!-- Mini Calendar Month Picker -->
      <div class="space-y-1.5 px-1 select-none">
        <div class="flex items-center justify-between">
          <span class="text-sm font-google font-medium text-[#3c4043]" id="mini-month-label">October 2026</span>
          <div class="flex items-center space-x-0.5">
            <button onclick="changeWeek(-1)" class="p-1 rounded-full hover:bg-[#f1f3f4] text-[#5f6368]"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
            <button onclick="changeWeek(1)" class="p-1 rounded-full hover:bg-[#f1f3f4] text-[#5f6368]"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
          </div>
        </div>

        <!-- Mini Day Headers: S M T W T F S -->
        <div class="grid grid-cols-7 text-center text-[10px] font-medium text-[#70757a] py-1">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>

        <!-- Mini Dates Grid -->
        <div id="mini-calendar-days" class="grid grid-cols-7 text-center text-xs gap-y-1">
          <!-- Dynamically populated to render exact highlight row -->
        </div>
      </div>

      <!-- "My calendars" section with Colored Checkboxes -->
      <div class="space-y-2.5 pt-2">
        <div class="flex items-center justify-between text-sm font-google font-medium text-[#3c4043]">
          <span>My calendars</span>
          <i data-lucide="chevron-up" class="w-4 h-4 text-[#5f6368]"></i>
        </div>

        <div id="course-list-sidebar" class="space-y-1.5 text-xs text-[#3c4043]">
          <!-- Populated with courses & colors from image -->
        </div>
      </div>

    </aside>

    <!-- RIGHT: MAIN CALENDAR WEEK GRID -->
    <main class="flex-1 flex flex-col overflow-hidden bg-white">
      
      <!-- Top Days Header: SUN 28, MON 29, TUE 30 (circled), WED 1, THU 2, FRI 3, SAT 4 -->
      <div class="flex border-b border-[#dadce0] shrink-0 bg-white z-10">
        <!-- Time gutter top-left empty cell -->
        <div class="w-14 shrink-0 grid-border-right flex items-end justify-center pb-1 text-[10px] text-[#70757a]">
          GMT+3
        </div>

        <!-- 7 Column Headers -->
        <div class="flex-1 grid grid-cols-7 text-center py-2" id="day-headers-row">
          <!-- Populated dynamically with active day circle -->
        </div>
      </div>

      <!-- Scrollable Time Slots & Event Area -->
      <div id="calendar-scroll-body" class="flex-1 overflow-y-auto flex relative">
        
        <!-- Time Gutter (8 AM to 8 PM) -->
        <div class="w-14 shrink-0 grid-border-right select-none bg-white">
          <div class="time-slot-height text-right pr-2 text-[10px] text-[#70757a] -mt-2">8 AM</div>
          <div class="time-slot-height text-right pr-2 text-[10px] text-[#70757a] -mt-2">9 AM</div>
          <div class="time-slot-height text-right pr-2 text-[10px] text-[#70757a] -mt-2">10 AM</div>
          <div class="time-slot-height text-right pr-2 text-[10px] text-[#70757a] -mt-2">11 AM</div>
          <div class="time-slot-height text-right pr-2 text-[10px] text-[#70757a] -mt-2">12 PM</div>
          <div class="time-slot-height text-right pr-2 text-[10px] text-[#70757a] -mt-2">1 PM</div>
          <div class="time-slot-height text-right pr-2 text-[10px] text-[#70757a] -mt-2">2 PM</div>
          <div class="time-slot-height text-right pr-2 text-[10px] text-[#70757a] -mt-2">3 PM</div>
          <div class="time-slot-height text-right pr-2 text-[10px] text-[#70757a] -mt-2">4 PM</div>
          <div class="time-slot-height text-right pr-2 text-[10px] text-[#70757a] -mt-2">5 PM</div>
          <div class="time-slot-height text-right pr-2 text-[10px] text-[#70757a] -mt-2">6 PM</div>
          <div class="time-slot-height text-right pr-2 text-[10px] text-[#70757a] -mt-2">7 PM</div>
          <div class="time-slot-height text-right pr-2 text-[10px] text-[#70757a] -mt-2">8 PM</div>
        </div>

        <!-- 7 Days Grid Area (Height: 13 hours * 52px = 676px) -->
        <div class="flex-1 grid grid-cols-7 relative" style="height: 676px;">
          
          <!-- Horizontal Grid Lines -->
          <div class="absolute inset-0 pointer-events-none">
            <div class="time-slot-height grid-border-bottom"></div>
            <div class="time-slot-height grid-border-bottom"></div>
            <div class="time-slot-height grid-border-bottom"></div>
            <div class="time-slot-height grid-border-bottom"></div>
            <div class="time-slot-height grid-border-bottom"></div>
            <div class="time-slot-height grid-border-bottom"></div>
            <div class="time-slot-height grid-border-bottom"></div>
            <div class="time-slot-height grid-border-bottom"></div>
            <div class="time-slot-height grid-border-bottom"></div>
            <div class="time-slot-height grid-border-bottom"></div>
            <div class="time-slot-height grid-border-bottom"></div>
            <div class="time-slot-height grid-border-bottom"></div>
            <div class="time-slot-height grid-border-bottom"></div>
          </div>

          <!-- Vertical Columns for each Day (0 to 6) -->
          <div class="grid-border-right h-full relative" id="col-day-0"></div> <!-- SUN -->
          <div class="grid-border-right h-full relative" id="col-day-1"></div> <!-- MON -->
          <div class="grid-border-right h-full relative" id="col-day-2"></div> <!-- TUE -->
          <div class="grid-border-right h-full relative" id="col-day-3"></div> <!-- WED -->
          <div class="grid-border-right h-full relative" id="col-day-4"></div> <!-- THU -->
          <div class="grid-border-right h-full relative" id="col-day-5"></div> <!-- FRI -->
          <div class="h-full relative" id="col-day-6"></div> <!-- SAT -->

        </div>

      </div>

    </main>

  </div>

  <!-- ================= POPUP MODAL ================= -->
  <div id="gcal-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/30 hidden" onclick="if(event.target === this) closeModal()">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border border-[#dadce0] animate-in fade-in zoom-in-95 duration-100">
      
      <!-- Modal Top Color Bar -->
      <div id="modal-color-bar" class="h-2 w-full bg-[#1a73e8]"></div>

      <div class="p-6 space-y-4">
        <!-- Close button & Course Type -->
        <div class="flex items-center justify-between">
          <span id="modal-type-tag" class="px-2 py-0.5 rounded text-[11px] font-bold uppercase tracking-wider bg-blue-50 text-blue-700">
            Lecture
          </span>
          <button onclick="closeModal()" class="p-1 rounded-full hover:bg-[#f1f3f4] text-[#5f6368]">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Course Title -->
        <div>
          <h3 id="modal-title" class="text-xl font-google font-bold text-[#3c4043] leading-snug">
            Calculus II
          </h3>
          <div class="flex items-center space-x-2 text-xs text-[#5f6368] mt-1">
            <i data-lucide="clock" class="w-3.5 h-3.5 text-[#5f6368]"></i>
            <span id="modal-time">9:00am – 10:15am</span>
          </div>
          <div class="flex items-center space-x-2 text-xs text-[#5f6368] mt-1">
            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-[#5f6368]"></i>
            <span id="modal-room">Room 214 · Dr. Reyes</span>
          </div>
        </div>

        <!-- Quiz Alert Callout if a quiz is scheduled -->
        <div id="modal-quiz-banner" class="p-3.5 rounded-lg bg-[#f3e8fd] border border-[#d1c4e9] text-[#4a148c] space-y-2 hidden">
          <div class="flex items-center space-x-2 font-google font-bold text-xs uppercase tracking-wider">
            <span>⚡ Upcoming Quiz Details</span>
          </div>
          <p id="modal-quiz-desc" class="text-xs text-[#4a148c] font-medium leading-relaxed"></p>
          <div id="modal-quiz-topics" class="flex flex-wrap gap-1 pt-1"></div>
        </div>

        <!-- Action Buttons -->
        <div class="pt-3 border-t border-[#dadce0] flex items-center justify-between">
          <a id="modal-moodle-btn" href="#" target="_blank" class="text-xs text-[#1a73e8] hover:underline flex items-center space-x-1 font-medium">
            <span>Moodle Link</span>
            <i data-lucide="external-link" class="w-3 h-3"></i>
          </a>

          <div class="flex items-center space-x-2">
            <a id="modal-ics-btn" href="#" class="px-3 py-1.5 rounded-md border border-[#dadce0] text-xs font-medium text-[#3c4043] hover:bg-[#f1f3f4] transition">
              Download .ics
            </a>
            <a id="modal-gcal-btn" href="#" target="_blank" class="px-3.5 py-1.5 rounded-md bg-[#1a73e8] hover:bg-[#1765cc] text-white text-xs font-medium shadow-xs transition flex items-center space-x-1">
              <i data-lucide="bell" class="w-3.5 h-3.5"></i>
              <span>Add Reminder</span>
            </a>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
