<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizRadar — Google Sign-In Successful</title>
  <style>
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #131927;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    .icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(16,185,129,0.15);
      color: #34d399;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 19px;
      margin: 0 0 8px 0;
      color: #ffffff;
      font-weight: 700;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 20px 0;
      word-break: break-word;
    }
    .btn {
      display: inline-block;
      background: #1a73e8;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 11px 22px;
      border-radius: 10px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #1557b0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h2>Google Account Connected!</h2>
    <p>You are signed in. You can close this tab and return to the QuizRadar app — your account, email, and calendar will sync automatically.</p>
    <button class="btn" onclick="window.close();">Return to QuizRadar</button>
  </div>
  <script>
    setTimeout(function() {
      try { window.close(); } catch(e) {}
    }, 1500);
  </script>
</body>
</html>
