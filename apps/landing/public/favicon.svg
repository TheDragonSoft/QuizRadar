<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="qrBg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="qrSweep" x1="128" y1="36" x2="210" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="qrShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Squircle App Icon Background -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#qrBg)" filter="url(#qrShadow)"/>
  <rect x="14" y="14" width="228" height="228" rx="54" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Top Calendar Binder Tabs -->
  <rect x="78" y="28" width="16" height="26" rx="8" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="162" y="28" width="16" height="26" rx="8" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Outer & Middle Radar Rings -->
  <circle cx="128" cy="136" r="76" stroke="#ffffff" stroke-opacity="0.22" stroke-width="5"/>
  <circle cx="128" cy="136" r="50" stroke="#ffffff" stroke-opacity="0.32" stroke-width="4" stroke-dasharray="10 8"/>
  <circle cx="128" cy="136" r="24" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4"/>

  <!-- Radar Sweep Sector -->
  <path d="M128 136 L128 60 A76 76 0 0 1 198 106 Z" fill="url(#qrSweep)"/>

  <!-- Radar Sweep Hand -->
  <line x1="128" y1="136" x2="184" y2="84" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>

  <!-- Center Core Pulse -->
  <circle cx="128" cy="136" r="10" fill="#ffffff"/>
  <circle cx="128" cy="136" r="5" fill="#1d4ed8"/>

  <!-- Detected Exam Blips -->
  <circle cx="174" cy="93" r="9" fill="#facc15"/>
  <circle cx="174" cy="93" r="15" stroke="#facc15" stroke-opacity="0.45" stroke-width="3"/>

  <circle cx="92" cy="112" r="6.5" fill="#34d399"/>
  <circle cx="156" cy="166" r="6.5" fill="#f87171"/>
</svg>
