name: Release
# v5 release pipeline (phase 15): a v* tag push builds desktop+android+PWA and
# publishes the GitHub Release with the signed updater manifest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v5.0.0-alpha.1)"
        required: false

# Least-privilege default permissions — individual jobs grant write as needed
permissions:
  contents: read

jobs:
  validate:
    name: Validate Version & Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Version Sinks
        run: node tooling/generate-version.mjs --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # `cargo clippy --workspace` compiles the Tauri desktop shell, which on
      # Linux needs the same system libraries ci.yml's rust job installs —
      # without them glib-sys/webkit2gtk-sys fail their pkg-config probes.
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: install wasm-bindgen-cli (version pinned by Cargo.lock)
        run: |
          WASM_BINDGEN_VERSION="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)"
          echo "wasm-bindgen-cli ${WASM_BINDGEN_VERSION}"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      # The WASM artifact must exist before `tsc` runs: `wasmBridge.ts` imports
      # the generated `public/wasm/quizradar_wasm.js` (same ordering as ci.yml).
      - name: Build Web WASM Bundle
        run: pnpm --dir apps/web build:wasm
      - name: Rust format check
        run: cargo fmt --all --check
      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Web tests & typecheck
        run: |
          pnpm typecheck
          pnpm test

  build-desktop:
    name: Desktop (${{ matrix.platform.name }})
    needs: validate
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # NSIS installer only — `all` would also build an MSI, whose WiX
            # download is an extra moving part the release never needed.
            bundles: nsis
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # `cargo tauri build` runs the web bundle's beforeBuildCommand, whose
      # build-wasm.mjs needs the wasm32 target AND the version-pinned
      # wasm-bindgen CLI on PATH (the ci.yml web job installs the same pair).
      - name: install wasm-bindgen-cli (version pinned by Cargo.lock)
        shell: bash
        run: |
          WASM_BINDGEN_VERSION="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)"
          echo "wasm-bindgen-cli ${WASM_BINDGEN_VERSION}"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Web Bundle
        run: pnpm --filter @quizradar/web build

      - name: Build Tauri Desktop Application & Updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo tauri build --target ${{ matrix.platform.target }} --bundles ${{ matrix.platform.bundles }}

      - name: Stage Windows Portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Get-Content tooling/version.json | ConvertFrom-Json).version
          $stage = "dist-portable"
          New-Item -ItemType Directory -Force -Path $stage
          Copy-Item "target/${{ matrix.platform.target }}/release/quizradar-desktop.exe" -Destination "$stage/quizradar.exe"
          Compress-Archive -Path "$stage/*" -DestinationPath "target/${{ matrix.platform.target }}/release/bundle/QuizRadar-Portable-win-x64.zip"

      # Tauri v2 names the macOS updater artifacts without an architecture
      # (`QuizRadar.app.tar.gz`); the updater manifest generator needs the
      # arch in the filename to emit `darwin-aarch64` instead of guessing.
      - name: Name the macOS updater artifacts with their architecture
        if: runner.os == 'macOS'
        run: |
          cd target/aarch64-apple-darwin/release/bundle/macos
          for f in QuizRadar.app.tar.gz QuizRadar.app.tar.gz.sig; do
            mv "$f" "QuizRadar_aarch64.${f#QuizRadar.}"
          done
          ls -la

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform.target }}
          path: |
            target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.platform.target }}/release/bundle/nsis/*.zip
            target/${{ matrix.platform.target }}/release/bundle/nsis/*.sig
            target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.platform.target }}/release/bundle/macos/*.tar.gz
            target/${{ matrix.platform.target }}/release/bundle/macos/*.sig
            target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.platform.target }}/release/bundle/appimage/*.tar.gz
            target/${{ matrix.platform.target }}/release/bundle/appimage/*.sig
            target/${{ matrix.platform.target }}/release/bundle/*.zip
          if-no-files-found: warn

  build-android:
    name: Android Release (APK & AAB)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # `tooling/build-android-libs.mjs` (run by the Gradle `buildAndroidRustLibs`
      # task) is a Node script, so the release job needs Node on PATH too.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The APK/AAB is a Kotlin shell around the Rust core (UniFFI): these
          # targets are what `assembleRelease` cross-builds
          # libquizradar_core.so with. Without them the released app would
          # crash on launch (UnsatisfiedLinkError).
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      # `nttld/setup-ndk@v1` 404s on r27b (its bundled manifest predates the
      # release); the runner's sdkmanager has it, and
      # `tooling/build-android-libs.mjs` locates the NDK via ANDROID_NDK_HOME.
      - name: install NDK r27b
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Build native core cdylib for uniffi
        run: cargo build -p quizradar-core --features uniffi

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Android Release Keystore
        # The `secrets` context is not available inside `if:` expressions on
        # GitHub Actions (workflow startup fails) — route it through env.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "::add-mask::${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          echo "::add-mask::${{ secrets.ANDROID_KEY_PASSWORD }}"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release.keystore"

      - name: Build Android Release APK & AAB
        env:
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/mobile-android
        run: |
          ./gradlew assembleRelease bundleRelease

      - name: Verify Signed APK with apksigner
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose apps/mobile-android/app/build/outputs/apk/release/app-release.apk

      # The app cannot start without the native core - the release must never
      # ship an APK/AAB whose Rust library is missing for a device ABI.
      - name: Verify the native core ships in the release artifacts
        run: |
          # Without a keystore the APK is unsigned, so the file name differs.
          APK=$(ls apps/mobile-android/app/build/outputs/apk/release/app-release*.apk | head -1)
          echo "checking $APK"
          unzip -l "$APK" \
            | grep -E "lib/(arm64-v8a|x86_64)/libquizradar_core\.so"
          unzip -l apps/mobile-android/app/build/outputs/bundle/release/app-release.aab \
            | grep -E "base/lib/(arm64-v8a|x86_64)/libquizradar_core\.so"
          # Only the ABIs the core is cross-built for may be advertised: a
          # 32-bit device would install the release and then crash with an
          # UnsatisfiedLinkError the moment the core is called.
          for artifact in \
            "$APK" \
            apps/mobile-android/app/build/outputs/bundle/release/app-release.aab; do
            if unzip -l "$artifact" | grep -E "lib/(armeabi|armeabi-v7a|mips|mips64|x86)/"; then
              echo "::error::$artifact advertises ABIs the Rust core is not built for"
              exit 1
            fi
          done

      - name: Cleanup Keystore File
        if: always()
        run: |
          rm -f "${{ github.workspace }}/release.keystore"

      - name: Prepare Android Output Artifacts
        run: |
          mkdir -p android-dist
          VER=$(node -e 'console.log(require("./tooling/version.json").version)')
          # Unsigned local builds are named app-release-unsigned.apk.
          APK=$(ls apps/mobile-android/app/build/outputs/apk/release/app-release*.apk | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "android-dist/QuizRadar-v${VER}.apk"
          fi
          if [ -f apps/mobile-android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp apps/mobile-android/app/build/outputs/bundle/release/app-release.aab "android-dist/QuizRadar-v${VER}.aab"
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android-dist/*

  deploy-pwa:
    name: Deploy PWA to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # The web build compiles the WASM core (build-wasm.mjs): it needs the
      # wasm32 target and the version-pinned wasm-bindgen CLI, exactly like
      # the ci.yml web job and the desktop matrix.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install wasm-bindgen-cli (version pinned by Cargo.lock)
        run: |
          WASM_BINDGEN_VERSION="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)"
          echo "wasm-bindgen-cli ${WASM_BINDGEN_VERSION}"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web Bundle
        run: pnpm --filter @quizradar/web build
      - name: Build Landing Site & Mount Web Companion at /app/
        env:
          ASTRO_SITE: https://thedragonsoft.github.io
          ASTRO_BASE: /QuizRadar
        run: node tooling/build-site.mjs --skip-web-build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    name: Publish GitHub Release & Updater Manifest
    needs: [build-desktop, build-android, deploy-pwa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Version & Tag
        id: meta
        run: |
          VER=$(node -e 'console.log(require("./tooling/version.json").version)')
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Explicit patterns: downloading everything would also pull the
      # `github-pages` site artifact, whose internal `artifact.tar` leaked
      # into the first published release.
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: android-release
          merge-multiple: true

      # The desktop upload globs preserved their bundle subdirectories
      # (nsis/, dmg/, macos/, deb/, appimage/); the checksum manifest and the
      # updater manifest generator both expect every file at the top level.
      - name: Flatten downloaded artifacts into release-assets/
        run: |
          find release-assets -mindepth 2 -type f -exec mv {} release-assets/ \;
          find release-assets -mindepth 1 -type d -empty -delete
          ls -la release-assets

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Tauri Updater Manifest (latest.json)
        run: |
          node tooling/generate-updater-manifest.mjs \
            --artifacts-dir release-assets \
            --tag ${{ steps.meta.outputs.tag }} \
            --version ${{ steps.meta.outputs.version }}

      - name: Generate Release Notes
        id: notes
        run: |
          node tooling/generate-changelog.mjs --notes-only > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "QuizRadar ${{ steps.meta.outputs.tag }} — Academic Radar & Exam Calendar"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, 'alpha') || contains(steps.meta.outputs.version, 'beta') }}
          files: |
            release-assets/*
