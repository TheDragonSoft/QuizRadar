# CI — the real green signal for QuizRadar v5.
#
# Every job runs the same commands a developer runs locally, so a green run
# here means a clean checkout is actually green:
#
#   version  — the single-source-of-truth gate (tooling/version.json → 5 sinks)
#   rust     — fmt / clippy / test for the whole Rust workspace
#   web      — eslint / prettier / tsc / vitest / WASM build
#   desktop  — the Tauri shell's own Rust tests (they are not part of
#              `cargo test --workspace` output today, so they get their own job)
#   android  — ktlint / assembleDebug / testDebugUnitTest
#   coverage — the two coverage producers plus the ratchet that fails when
#              coverage drops below the committed floor
#
# The version check runs first and gates every other job: a stale version sink
# must never hide behind a green test suite.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: version stamp (single source of truth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: version stamp check
        run: node tooling/generate-version.mjs --check

  rust:
    name: rust (fmt / clippy / test)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop shell is a workspace member, so every workspace-wide cargo
      # command needs the Tauri Linux build dependencies.
      - name: install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (warnings are blockers)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  web:
    name: web (lint / format / typecheck / vitest / wasm)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install
        run: pnpm install --frozen-lockfile
      # The WASM engine is built from source (tooling/build-wasm.mjs), and the
      # wasm-bindgen CLI must match the version Cargo.lock pins.
      - name: install wasm-bindgen-cli (version pinned by Cargo.lock)
        run: |
          WASM_BINDGEN_VERSION="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)"
          echo "wasm-bindgen-cli ${WASM_BINDGEN_VERSION}"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      # The WASM artifact must exist before `tsc` runs: `wasmBridge.ts` imports
      # the generated `public/wasm/quizradar_wasm.js`, which only a fresh
      # checkout has after this step (locally it lingers from a previous build,
      # which is why this ordering bug never surfaced on a dev machine).
      - name: wasm build
        run: pnpm --dir apps/web build:wasm
      - name: eslint
        run: pnpm lint
      - name: prettier
        run: pnpm format:check
      - name: typecheck
        run: pnpm typecheck
      - name: vitest
        run: pnpm test

  desktop:
    name: desktop (tauri shell tests)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: desktop shell tests
        run: cargo test -p quizradar-desktop

  android:
    name: android (ktlint / assembleDebug / test)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # `tooling/build-android-libs.mjs` (run by the Gradle `buildAndroidRustLibs`
      # task) is a Node script, so the Android job needs Node on PATH too.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The APK is a Kotlin shell around the Rust core (UniFFI): without
          # these targets `assembleDebug` cannot cross-build
          # libquizradar_core.so, and the APK would not even start.
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      # `nttld/setup-ndk@v1` 404s on r27b (its bundled version manifest predates
      # the release), so install the NDK with the runner's own sdkmanager —
      # `tooling/build-android-libs.mjs` locates it via ANDROID_NDK_HOME.
      - name: install NDK r27b
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - name: build native core cdylib for tests
        run: cargo build -p quizradar-core --features uniffi
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint
        run: ./gradlew ktlintCheck
        working-directory: apps/mobile-android
      - name: assembleDebug
        run: ./gradlew assembleDebug
        working-directory: apps/mobile-android
      - name: unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: apps/mobile-android
      - name: the debug APK must ship the native core
        run: |
          unzip -l apps/mobile-android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -E "lib/(arm64-v8a|x86_64)/libquizradar_core\.so"
          # Only the ABIs the core is cross-built for may be advertised: a
          # 32-bit device would install this APK and then crash with an
          # UnsatisfiedLinkError the moment the core is called.
          if unzip -l apps/mobile-android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -E "lib/(armeabi|armeabi-v7a|mips|mips64|x86)/"; then
            echo "::error::the APK advertises ABIs the Rust core is not built for"
            exit 1
          fi
      # The release build is the one that ships, and it has its own R8
      # configuration (shrinking + obfuscation). A broken release ProGuard
      # rule only shows up in a release build, so CI builds one too.
      - name: assembleRelease
        run: ./gradlew assembleRelease
        working-directory: apps/mobile-android
      - name: the release APK must ship the native core
        run: |
          APK=$(ls apps/mobile-android/app/build/outputs/apk/release/app-release*.apk | head -1)
          unzip -l "$APK" \
            | grep -E "lib/(arm64-v8a|x86_64)/libquizradar_core\.so"
          if unzip -l "$APK" \
            | grep -E "lib/(armeabi|armeabi-v7a|mips|mips64|x86)/"; then
            echo "::error::the release APK advertises ABIs the Rust core is not built for"
            exit 1
          fi

  coverage:
    name: coverage (rust + web ratchet)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install
        run: pnpm install --frozen-lockfile
      - name: install cargo-llvm-cov
        # Pinned so a toolchain change cannot silently move the measured
        # numbers the ratchet compares against.
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: install wasm-bindgen-cli (version pinned by Cargo.lock)
        run: |
          WASM_BINDGEN_VERSION="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)"
          echo "wasm-bindgen-cli ${WASM_BINDGEN_VERSION}"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: rust coverage
        run: pnpm coverage:rust
      - name: web coverage
        run: pnpm coverage:web
      - name: coverage ratchet
        run: pnpm coverage:ratchet
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            target/rust-coverage.json
            target/coverage
          if-no-files-found: error
