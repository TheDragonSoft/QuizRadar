name: PR UI Screenshots (Desktop & Rendered Android)

on:
  pull_request:
    paths:
      - "apps/web/src/**"
      - "apps/desktop/src-tauri/src/**"
      - "apps/mobile-android/app/src/main/**"
      - "core/src/**"
      - ".github/workflows/pr-ui-screenshots.yml"

concurrency:
  group: pr-ui-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  desktop-screenshots:
    name: Desktop & Web UI Screenshots (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: |
          WASM_BINDGEN_VER=$(node -e "const l=require('fs').readFileSync('Cargo.lock','utf8'); const m=l.match(/name = \"wasm-bindgen\"\nversion = \"([^\"]+)\"/); console.log(m?m[1]:'0.2.129')")
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VER" --locked
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Build WASM & Web bundle
        run: pnpm --dir apps/web build
      - name: Install Playwright Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Capture Desktop & Mobile-Web showcase screenshots
        env:
          QUIZRADAR_SHOWCASE_DIR: ${{ github.workspace }}/apps/web/e2e-results/pr-desktop
        run: pnpm --dir apps/web e2e:showcase
      - name: Upload Desktop UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-screenshots
          path: apps/web/e2e-results/pr-desktop/**/*.png
          if-no-files-found: warn

  android-rendered-screenshots:
    name: Android UI Screenshots (Robolectric Rendered, No Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build host Rust core cdylib for Robolectric
        run: cargo build -p quizradar-core --features uniffi
      - uses: gradle/actions/setup-gradle@v4
      - name: Render Android Compose UI screenshots (JVM / Robolectric)
        working-directory: apps/mobile-android
        run: ./gradlew testDebugUnitTest --tests "*AndroidUiCaptureTest*"
      - name: Upload Android rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-rendered-screenshots
          path: apps/web/public/android-ui/*.png
          if-no-files-found: error

  comment-pr:
    name: Post PR Screenshot Summary
    needs: [desktop-screenshots, android-rendered-screenshots]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- quizradar-ui-screenshots -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const desktopStatus = "${{ needs.desktop-screenshots.result }}";
            const androidStatus = "${{ needs.android-rendered-screenshots.result }}";
            const body = [
              marker,
              "### UI Screenshots (Desktop & Rendered Android)",
              "",
              `| Surface | Renderer | Status | Artifact |`,
              `|---|---|---|---|`,
              `| Desktop / Web | Playwright Chromium (\`e2e:showcase\`) | \`${desktopStatus}\` | \`desktop-ui-screenshots\` |`,
              `| Android (Compose M3) | Robolectric Native Graphics (no emulator) | \`${androidStatus}\` | \`android-rendered-screenshots\` |`,
              "",
              `Download both screenshot bundles from the [workflow run artifacts](${runUrl}).`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
