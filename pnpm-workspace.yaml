packages:
  - "apps/*"

# pnpm ≥12: dependency postinstall scripts are blocked by default. Allow-list
# only what legitimately ships one and needs it (esbuild resolves its
# platform binary in install.js; sharp uses prebuilt @img/sharp-* packages).
allowBuilds:
  # @swc/core resolves its platform binding in postinstall; used only by the
  # Ladle workbench toolchain, never shipped in the app bundle.
  '@swc/core': true
  core-js: false
  esbuild: true
  # msw ships a `msw init` postinstall that generates a public/ handler dir —
  # not needed (Ladle only offers it as an optional API-mocking addon).
  msw: false
  sharp: false
