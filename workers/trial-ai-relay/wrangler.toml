name = "quizradar-trial-ai-relay"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
TRIAL_DAILY_LIMIT = "10"
TRIAL_IP_DAILY_LIMIT = "30"
MAX_PAYLOAD_BYTES = "16777216"
GEMINI_UPSTREAM_BASE = "https://generativelanguage.googleapis.com/v1beta"

# Bind a KV namespace for persistent edge rate limiting across Worker isolates:
#   npx wrangler kv namespace create TRIAL_QUOTA_KV
# [[kv_namespaces]]
# binding = "TRIAL_QUOTA_KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
