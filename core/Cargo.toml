[package]
name = "quizradar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QuizRadar v5 core: parsers, planner, calendar, store, sources, auth — pure Rust, UI-agnostic."

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
# Async facade: store ops run on spawn_blocking so Tauri/Android callers
# never block their runtime threads on SQLite (phase 04 item 1). `macros`
# powers tokio::join! in the bounded-concurrency source scans (phase 05).
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
# Bounded-concurrency source scans (buffer_unordered/buffered) — phase 05.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# PKCE (RFC 7636) S256 challenge + single-use state entropy — phase 05.
# Small, pure-Rust, maintained crates; no client_secret flows exist at all.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }
# Recorded-HTTP fixture tests for the source fetchers (phase 05 acceptance).
wiremock = "0.6"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "deny"
panic = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
