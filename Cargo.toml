[workspace]
resolver = "2"
members = ["core", "apps/desktop/src-tauri", "core/bindings/wasm"]

[workspace.package]
edition = "2021"
# STAMPED by tooling/generate-version.mjs from tooling/version.json — do not edit.
version = "5.6.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
# rustls only — no native-tls in the dependency graph (locked stack, AGENTS §1).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
