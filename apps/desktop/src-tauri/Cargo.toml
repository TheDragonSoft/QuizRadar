[package]
name = "quizradar-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QuizRadar v5 desktop shell (Tauri 2) — thin glue over the core crate."

[lib]
name = "quizradar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
reqwest.workspace = true
thiserror.workspace = true

tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"

keyring = { version = "4.2", default-features = true }
tokio = { version = "1", features = ["sync", "rt", "net", "io-util", "time"] }
futures = "0.3"
# Ephemeral on-demand Desktop LAN HTTPS pairing (maintainer override 2026-11-20):
# rustls, tokio-rustls, sha2, base64, getrandom are already in Cargo.lock;
# rcgen generates the per-session self-signed TLS cert whose SHA-256 is pinned in the QR.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

quizradar-core = { path = "../../../core" }

[dev-dependencies]
# Recorded-HTTP fixture server for the sync/cancel integration tests (same
# version the core crate uses - no new package in the lockfile).
wiremock = "0.6"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "deny"
dbg_macro = "warn"
