# CI — the real green signal for QuizRadar v5.
#
# Every job runs the same commands a developer runs locally, so a green run
# here means a clean checkout is actually green:
#
#   version  — the single-source-of-truth gate (tooling/version.json → 5 sinks)
#   rust     — fmt / clippy / test for the whole Rust workspace (this includes
#              the Tauri desktop shell: `apps/desktop/src-tauri` is a workspace
#              member, so `cargo test --workspace` runs its tests — there is no
#              separate desktop job to keep green)
#   web      — eslint / prettier / tsc / vitest / WASM build
#   browser  — Playwright behavioral smoke (BLOCKING: every e2e DOM assertion)
#   browser-visual — Playwright pixel comparison vs committed baselines
#              (non-blocking until the baselines prove stable on ubuntu-latest)
#   android          — ktlint / assembleDebug / testDebugUnitTest
#   android-emulator — headless Android emulator (API 35), testDebugUnitTest, ktlintCheck, assembleDebug, screenshots & APK upload
#   coverage         — the two coverage producers plus the ratchet that fails when
#              coverage drops below the committed floor
#
# The version check runs first and gates every other job: a stale version sink
# must never hide behind a green test suite.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: "Ref to validate (used by the release pipeline)"
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: version, contract & multi-agent hygiene gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: version stamp check (5 sinks)
        run: node tooling/generate-version.mjs --check
      - name: rust-ts contract wire map freshness check
        run: node apps/web/src/contract/regenerate.mjs --check
      # Push mode: `github.event.before` is the previous tip — essential here,
      # because with fetch-depth: 0 the freshly pushed commit IS origin/main by
      # the time this runs, so a derived base would always produce an empty
      # range. For workflow_dispatch (and new branches) `before` is empty or
      # the all-zero sentinel; both are treated by agent-gate.mjs as "no
      # explicit base" and fall back to deriving origin/main. Env vars (not
      # inline expansion) keep an empty value from collapsing into
      # `--base --head`.
      - name: multi-agent hygiene & fragment check (push)
        # Release pipeline's workflow_call reuse already validated the tagged
        # commit's content; branch handoff fragments apply to PR/push branches.
        if: github.event_name == 'push'
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: node tooling/agent-gate.mjs --ci --base "$EVENT_BEFORE" --head "$GITHUB_SHA"
      - name: multi-agent commit, secret & handoff fragment check (PR)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: >-
          node tooling/agent-gate.mjs --ci
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}

  rust:
    name: rust (fmt / clippy / test)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop shell is a workspace member, so every workspace-wide cargo
      # command needs the Tauri Linux build dependencies.
      - name: install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (warnings are blockers)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  web:
    name: web (lint / format / typecheck / vitest / wasm)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install
        run: pnpm install --frozen-lockfile
      # The WASM engine is built from source (tooling/build-wasm.mjs), and the
      # wasm-bindgen CLI must match the version Cargo.lock pins.
      - name: install wasm-bindgen-cli (version pinned by Cargo.lock)
        run: |
          WASM_BINDGEN_VERSION="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)"
          echo "wasm-bindgen-cli ${WASM_BINDGEN_VERSION}"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      # The WASM artifact must exist before `tsc` runs: `wasmBridge.ts` imports
      # the generated `public/wasm/quizradar_wasm.js`, which only a fresh
      # checkout has after this step (locally it lingers from a previous build,
      # which is why this ordering bug never surfaced on a dev machine).
      - name: wasm build
        run: pnpm --dir apps/web build:wasm
      - name: eslint
        run: pnpm lint
      - name: prettier
        run: pnpm format:check
      - name: typecheck
        run: pnpm typecheck
      - name: vitest
        run: pnpm test
      - name: tooling meta-tests
        run: pnpm test:tooling
      - name: landing static build
        run: pnpm --filter @quizradar/landing build

  # Playwright split into TWO jobs (docs/TESTING-PLAYBOOK.md §5):
  #   browser        — BLOCKING behavioral smoke: every spec WITHOUT a visual
  #                    snapshot (`--grep-invert @visual`). DOM assertions
  #                    (honest empty states, modals, labels) are
  #                    platform-independent, so a failure here is a real
  #                    regression, not rasteriser noise.
  #   browser-visual — OPTIONAL platform-sensitive pixel comparison
  #                    (`--grep @visual`), still `continue-on-error` until the
  #                    committed baselines in `apps/web/e2e-baselines/` are
  #                    regenerated/verified on the CI runner (they were made
  #                    on dev machines; glyph rasterisation can differ per
  #                    platform). An optional failure is reported as such —
  #                    it is NOT a gate and must never be called one.
  # Both jobs share the setup below via the YAML anchor. Promote
  # browser-visual to blocking only after a verified runner run, and keep the
  # playbook's claim about what CI runs in sync with that change.
  browser:
    name: browser (behavioral smoke, blocking)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The Playwright webServer command runs `tooling/build-wasm.mjs` itself,
      # which hard-fails when the wasm-bindgen CLI is missing or mismatched.
      - name: install wasm-bindgen-cli (version pinned by Cargo.lock)
        run: |
          WASM_BINDGEN_VERSION="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)"
          echo "wasm-bindgen-cli ${WASM_BINDGEN_VERSION}"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: install
        run: pnpm install --frozen-lockfile
      - name: install playwright chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: playwright behavioral smoke (no pixel comparison)
        run: pnpm --dir apps/web exec playwright test --grep-invert @visual
      - name: upload behavioral failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-behavioral-results
          path: apps/web/e2e-results
          if-no-files-found: ignore
          retention-days: 14

  browser-visual:
    name: browser (visual baselines, non-blocking)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install wasm-bindgen-cli (version pinned by Cargo.lock)
        run: |
          WASM_BINDGEN_VERSION="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)"
          echo "wasm-bindgen-cli ${WASM_BINDGEN_VERSION}"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: install
        run: pnpm install --frozen-lockfile
      - name: install playwright chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: playwright visual baseline comparison
        run: pnpm --dir apps/web exec playwright test --grep @visual
      - name: upload visual baseline diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-visual-diffs
          path: apps/web/e2e-results
          if-no-files-found: ignore

  android:
    name: android (ktlint / lint / assemble / test / native abi)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # `tooling/build-android-libs.mjs` (run by the Gradle `buildAndroidRustLibs`
      # task) is a Node script, so the Android job needs Node on PATH too.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The APK is a Kotlin shell around the Rust core (UniFFI): without
          # these targets `assembleDebug` cannot cross-build
          # libquizradar_core.so, and the APK would not even start.
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      # `nttld/setup-ndk@v1` 404s on r27b (its bundled version manifest predates
      # the release), so install the NDK with the runner's own sdkmanager —
      # `tooling/build-android-libs.mjs` locates it via ANDROID_NDK_HOME.
      - name: install NDK r27b
        run: |
          # Bounded license responses avoid yes(1) exiting nonzero on a broken pipe.
          printf 'y\n%.0s' {1..100} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - name: build native core cdylib for tests
        run: cargo build -p quizradar-core --features uniffi
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint
        run: ./gradlew ktlintCheck
        working-directory: apps/mobile-android
      # Explicit release-variant lint catches R8/ProGuard-only findings.
      - name: lint release
        run: ./gradlew lintRelease
        working-directory: apps/mobile-android
      - name: assembleDebug
        run: ./gradlew assembleDebug
        working-directory: apps/mobile-android
      - name: unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: apps/mobile-android
      - name: the debug APK must ship the native core
        run: node tooling/verify-android-artifacts.mjs --kind apk --path apps/mobile-android/app/build/outputs/apk/debug/app-debug.apk
      # The release build is the one that ships, and it has its own R8
      # configuration (shrinking + obfuscation). A broken release ProGuard
      # rule only shows up in a release build, so CI builds one too.
      - name: assembleRelease
        run: ./gradlew assembleRelease
        working-directory: apps/mobile-android
      - name: the release APK must ship the native core
        run: |
          APK=$(ls apps/mobile-android/app/build/outputs/apk/release/app-release*.apk | head -1)
          node tooling/verify-android-artifacts.mjs --kind apk --path "$APK"
      - name: upload debug apk for emulator smoke
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/mobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # This job no longer duplicates the Android build: it consumes the exact
  # artifact validated above and proves the app really installs and starts
  # with its native Rust core on the API 35 emulator.
  android-emulator:
    name: android emulator (api 35 install / launch / native smoke)
    needs: [version, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: apps/mobile-android/app/build/outputs/apk/debug
      - name: enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-x86_64-${{ runner.os }}
      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: install, launch and verify the built app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            mkdir -p apps/mobile-android/build/outputs/emulator-screenshots
            adb exec-out screencap -p > apps/mobile-android/build/outputs/emulator-screenshots/emulator-booted.png
            # Cached AVDs may contain a build signed with a different key.
            # A fresh emulator may have nothing to uninstall; both are fine.
            adb uninstall com.quizradar.app || true
            adb install -r apps/mobile-android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.quizradar.app/.MainActivity
            sleep 10
            test -n "$(adb shell pidof com.quizradar.app)" || { echo "::error::QuizRadar did not stay running after launch"; adb logcat -d > apps/mobile-android/build/outputs/emulator-screenshots/emulator-post-launch.logcat.txt; exit 1; }
            adb logcat -d > apps/mobile-android/build/outputs/emulator-screenshots/emulator-post-launch.logcat.txt
            ! grep -E "FATAL EXCEPTION|ANR in com\.quizradar\.app|UnsatisfiedLinkError" apps/mobile-android/build/outputs/emulator-screenshots/emulator-post-launch.logcat.txt || { echo "::error::QuizRadar startup hit a fatal/native-link failure"; exit 1; }
            adb exec-out screencap -p > apps/mobile-android/build/outputs/emulator-screenshots/emulator-post-launch.png
      - name: upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-screenshots
          path: |
            apps/mobile-android/build/outputs/emulator-screenshots/*.png
            apps/mobile-android/build/outputs/emulator-screenshots/emulator-post-launch.logcat.txt
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: coverage (rust + web ratchet)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install
        run: pnpm install --frozen-lockfile
      - name: install cargo-llvm-cov
        # Pinned so a toolchain change cannot silently move the measured
        # numbers the ratchet compares against.
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: install wasm-bindgen-cli (version pinned by Cargo.lock)
        run: |
          WASM_BINDGEN_VERSION="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)"
          echo "wasm-bindgen-cli ${WASM_BINDGEN_VERSION}"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: rust coverage
        run: pnpm coverage:rust
      # `coverage:web` runs the vitest suite, and `wasmBridge.ts` statically
      # imports the generated `public/wasm/quizradar_wasm.js` — without this
      # build step a fresh checkout fails at import time, exactly like the web
      # job's ordering fix above. The wasm-bindgen-cli install step in this job
      # already pins the version Cargo.lock requires.
      - name: wasm build
        run: pnpm --dir apps/web build:wasm
      - name: web coverage
        run: pnpm coverage:web
      - name: coverage ratchet
        run: pnpm coverage:ratchet
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            target/rust-coverage.json
            target/coverage
          if-no-files-found: error

  # One check name branch protection can require. browser-visual remains
  # deliberately non-blocking until its Linux baselines are verified; every
  # job listed here is a real gate.
  ci-success:
    name: ci-success (all blocking gates)
    needs: [version, rust, web, browser, android, android-emulator, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fail if any blocking job did not succeed
        env:
          VERSION_RESULT: ${{ needs.version.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          WEB_RESULT: ${{ needs.web.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          EMULATOR_RESULT: ${{ needs.android-emulator.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          set -e
          failed=0
          for check in "version:$VERSION_RESULT" "rust:$RUST_RESULT" "web:$WEB_RESULT" "browser:$BROWSER_RESULT" "android:$ANDROID_RESULT" "android-emulator:$EMULATOR_RESULT" "coverage:$COVERAGE_RESULT"; do
            name="${check%%:*}"
            result="${check##*:}"
            if [ "$result" != "success" ]; then
              echo "::error::required CI job $name finished as $result"
              failed=1
            fi
          done
          exit "$failed"
